
name: Auto Sync to My PingUp

on:
  push:
    branches:
      - loi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'ductruong02/mangxahoi'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Create clean snapshot
        run: |
          # Create a new branch without old commit history
          git switch --orphan sync-snapshot

          # Add current project files
          git add -A

          # Remove all environment files from the snapshot
          git ls-files -z | grep -zE '(^|/)\.env($|\.)' | xargs -0 -r git rm --cached --ignore-unmatch

          # Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create a clean snapshot commit
          git commit -m "Sync latest PingUp source without environment files"

      - name: Push snapshot to destination
        env:
          TOKEN: ${{ secrets.PINGUP_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ERROR: PINGUP_SYNC_TOKEN is missing."
            exit 1
          fi

          git push \
            "https://x-access-token:${TOKEN}@github.com/LoiLeVan2/pingup.git" \
            HEAD:refs/heads/loi \
            --force
