
name: Auto Sync to My PingUp

on:
  push:
    branches:
      - loi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'ductruong02/mangxahoi'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: loi
          fetch-depth: 1
          persist-credentials: false

      - name: Create clean snapshot
        run: |
          # Create a temporary directory for clean snapshot
          mkdir -p "$RUNNER_TEMP/pingup-clean"

          # Copy source files, excluding Git metadata and environment files
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='**/.env' \
            --exclude='**/.env.*' \
            --exclude='**/node_modules' \
            ./ "$RUNNER_TEMP/pingup-clean/"

          # Create a new orphan branch
          git switch --orphan sync-snapshot

          # Remove tracked files from the index
          git rm -r --cached . 2>/dev/null || true

          # Copy clean snapshot into workspace
          rsync -a --delete \
            --exclude='.git' \
            "$RUNNER_TEMP/pingup-clean/" ./

          # Stage all clean files
          git add -f .

          # Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check staged files
          git status --short

          # Create snapshot commit
          git commit -m "Sync latest PingUp source without environment files"

      - name: Push snapshot to destination
        env:
          TOKEN: ${{ secrets.PINGUP_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ERROR: PINGUP_SYNC_TOKEN is missing."
            exit 1
          fi

          git push \
            "https://x-access-token:${TOKEN}@github.com/LoiLeVan2/pingup.git" \
            HEAD:refs/heads/loi \
            --force
