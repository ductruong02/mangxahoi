
name: Auto Sync to My PingUp

on:
  push:
    branches:
      - loi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'ductruong02/mangxahoi'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push loi to destination loi
        env:
          TOKEN: ${{ secrets.PINGUP_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ERROR: PINGUP_SYNC_TOKEN is missing."
            exit 1
          fi

          git push \
            "https://x-access-token:${TOKEN}@github.com/LoiLeVan2/pingup.git" \
            HEAD:refs/heads/loi \
            --force
